# Deploy the project page to GitHub Pages (https://crepe-neurips2026.github.io).
# Runs only in the hosting repository; Settings -> Pages -> Source must be "GitHub Actions".
# The site is ~330 MB, which can exceed the 10-minute limit of the default branch deployment,
# so the deploy step gets a 30-minute timeout.
name: Deploy project page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'CRePE-neurips2026/crepe-neurips2026.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the page files
        run: |
          mkdir _site
          cp -r index.html .nojekyll static _site/
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
